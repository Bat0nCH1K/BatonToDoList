<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BatonToDoList v2.2</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e94560">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">

    <div id="onboarding" class="onboarding hidden">
        <div class="onboarding-content">
            <h2>👋 Добро пожаловать!</h2>
            <p>Это твой список задач. Создавай папки, добавляй задачи, ставь дедлайны и отслеживай прогресс.</p>
            <button class="btn" id="onboardingBtn">Понятно!</button>
        </div>
    </div>

    <div id="app">
        <div class="header">
            <button class="hamburger" id="hamburgerBtn">☰</button>
            <h2 id="currentFolderName">Все задачи</h2>
            <button class="btn-icon" id="addTaskBtn">+</button>
        </div>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>📁 Папки</h3>
                <button class="btn-icon" id="addFolderBtn">+</button>
            </div>
            <div class="folder-list" id="folderList"></div>
            <div class="sidebar-footer">
                <button class="btn-sm" id="calendarBtn">📅 Календарь</button>
                <button class="btn-sm" id="statsBtn">📊 Статистика</button>
                <button class="btn-sm" id="installBtn">📲 Установить приложение</button>
                <button class="btn-sm" id="supportBtn">💬 Поддержка</button>
                <button class="btn-sm" id="settingsBtn">⚙️ Настройки</button>
            </div>
        </div>
        <div class="task-list" id="taskList"></div>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3 id="modalTitle">Новая задача</h3>
            <input type="text" id="taskNameInput" placeholder="Название задачи">
            <label id="labelDeadline">📅 Дедлайн: <input type="datetime-local" id="taskDeadline"></label>
            <div class="preview-deadline" id="previewDeadline"></div>
            <label id="labelColor">🎨 Цвет: <input type="color" id="taskColor" value="#e94560"><span class="color-preview" id="colorPreview" style="background:#e94560"></span></label>
            <label id="labelRepeat">🔢 Количество раз: <input type="number" id="taskRepeat" value="1" min="1" max="99"></label>
            <label id="labelImage">🖼 Картинка: <input type="file" id="taskImage" accept="image/*"></label>
            <img id="imagePreview" class="image-preview" style="display:none;">
            <div class="modal-buttons">
                <button class="btn" id="saveTaskBtn">Сохранить</button>
                <button class="btn btn-cancel" id="cancelTaskBtn">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="folderModal">
        <div class="modal-content">
            <h3 id="folderModalTitle">Новая папка</h3>
            <input type="text" id="folderNameInput" placeholder="Название папки">
            <label>🎨 Цвет: <input type="color" id="folderColor" value="#4a90d9"></label>
            <div class="modal-buttons">
                <button class="btn" id="saveFolderBtn">Сохранить</button>
                <button class="btn btn-cancel" id="cancelFolderBtn">Отмена</button>
            </div>
        </div>
    </div>

    <div class="fullscreen" id="calendarScreen">
        <div class="calendar-header">
            <button class="btn-icon" id="calPrev">←</button>
            <h3 id="calMonthYear"></h3>
            <button class="btn-icon" id="calNext">→</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div id="calendarTaskList"></div>
        <button class="btn" id="closeCalendarBtn">Закрыть</button>
    </div>

    <div class="fullscreen" id="statsScreen">
        <h3>📊 Статистика</h3>
        <canvas id="statsChart" width="220" height="220"></canvas>
        <div class="stats-legend">
            <span class="stat-done">✅ Сделано: <span id="statDone">0</span></span>
            <span class="stat-active">📋 Активно: <span id="statActive">0</span></span>
            <span class="stat-overdue">⏰ Просрочено: <span id="statOverdue">0</span></span>
        </div>
        <button class="btn" id="closeStatsBtn">Закрыть</button>
    </div>

    <div class="fullscreen" id="settingsScreen">
        <h3>⚙️ Настройки</h3>
        <label>Тема: <select id="themeSelect"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
        <label>Язык: <select id="langSelect"><option value="ru">Русский</option><option value="en">English</option></select></label>
        <button class="btn" id="resetOnboardingBtn">Пройти обучение заново</button>
        <button class="btn" id="closeSettingsBtn">Закрыть</button>
    </div>

    <div class="version">v2.2 — BatonToDoList</div>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        
        // Кнопка установки PWA
        (function() {
            const installBtn = document.getElementById('installBtn');
            if (!installBtn) return;
            
            let deferredPrompt;
            
            if (localStorage.getItem('pwa-todo-installed') === '1' || 
                window.matchMedia('(display-mode: standalone)').matches) {
                installBtn.style.display = 'none';
                return;
            }
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.style.display = '';
            });
            
            installBtn.addEventListener('click', () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((result) => {
                        if (result.outcome === 'accepted') {
                            localStorage.setItem('pwa-todo-installed', '1');
                            installBtn.style.display = 'none';
                        }
                    });
                } else {
                    alert('Нажми ⋮ (меню) → «Добавить на главный экран»');
                }
            });
            
            setTimeout(() => {
                if (!deferredPrompt && installBtn.style.display !== 'none' && 
                    localStorage.getItem('pwa-todo-installed') !== '1') {
                    installBtn.style.display = '';
                }
            }, 5000);
        })();
    </script>
</body>
</html>
